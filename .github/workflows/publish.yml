name: Sync Notion and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
concurrency:
  group: site-publish
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test
        run: node --test
      - name: Read public pages from Notion
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync.mjs
      - name: Save changed content
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content
          git commit -m 'Update public content from Notion'
          git push
      # 예약 실행은 내용이 바뀌었거나, 직전 실행이 실패했을 때(배포가 밀렸을 수 있음)만 배포합니다.
      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          deploy=false
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$CHANGED" = "true" ]; then
            deploy=true
          else
            prev=$(gh api "repos/${{ github.repository }}/actions/workflows/publish.yml/runs?per_page=10" \
              -q '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .status == "completed")][0].conclusion' 2>/dev/null || echo unknown)
            echo "Previous run: $prev"
            [ "$prev" = "success" ] || deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Build site
        if: steps.decide.outputs.deploy == 'true'
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.decide.outputs.deploy == 'true'
