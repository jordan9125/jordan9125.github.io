name: Diagnose Notion connection
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/diagnose.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
